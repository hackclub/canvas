services:
  postgres:
    image: postgres:18-alpine
    container_name: canvas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-canvas}
    ports:
      # Bound to localhost only so the database isn't exposed on the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Run a single copy: the canvas is kept in memory and streamed to clients from this process
  app:
    build:
      context: .
      target: app
    container_name: canvas-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    # Applies pending migrations when it starts
    depends_on:
      postgres:
        condition: service_healthy
    # Nuxt reads these at runtime (NUXT_ prefix, see runtimeConfig in nuxt.config.ts), since
    # the values in .env aren't available to the built app
    environment:
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER:-canvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-canvas}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in .env}
      NUXT_TOKEN_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      NUXT_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NUXT_HCA_CLIENT_ID: ${HCA_CLIENT_ID}
      NUXT_HCA_CLIENT_SECRET: ${HCA_CLIENT_SECRET}
      NUXT_HACKATIME_CLIENT_ID: ${HACKATIME_CLIENT_ID}
      NUXT_HACKATIME_CLIENT_SECRET: ${HACKATIME_CLIENT_SECRET}
      NUXT_AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      NUXT_AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      NUXT_AIRTABLE_TABLE: ${AIRTABLE_TABLE:-}
      NUXT_SLACK_BOT_TOKEN: ${SLACK_XOXB:-}
      NUXT_R2_ENDPOINT: ${R2_ENDPOINT}
      NUXT_R2_REGION: ${R2_REGION:-auto}
      NUXT_R2_BUCKET: ${R2_BUCKET}
      NUXT_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      NUXT_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}

volumes:
  postgres-data:
